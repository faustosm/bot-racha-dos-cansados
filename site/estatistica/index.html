<!doctype html>
<!--
  GERADO - nao edite neste repo.

  Fonte: faustosm/bot-racha-dos-cansados, em site/. O conteudo desta pagina e
  do bot (a regra que ela descreve vive em bot/src/domain/), entao ela muda no
  mesmo commit que a regra e chega aqui por `make publicar-site`.

  Editar direto aqui funciona ate a proxima publicacao, que sobrescreve.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">
<meta name="robots" content="noindex">
<title>Súmula dos Cansados</title>
<link rel="icon" href="/icon-192.png">
<script src="/theme-init.js"></script>
<style>
  @font-face {
    font-family: 'Oswald';
    font-style: normal;
    font-weight: 200 700;
    font-display: swap;
    src: url('/fonts/oswald-latin.woff2') format('woff2');
  }

  :root {
    color-scheme: dark;
    --bg: #020617;
    --surface: #0f172a;
    --surface-2: #1e293b;
    --border: #1e293b;
    --border-soft: #172033;
    --ink: #ffffff;
    --ink-2: #f1f5f9;
    --ink-muted: #94a3b8;
    --ink-faint: #64748b;
    --accent: #fbbf24;

    /* Series (slots 1-3 da paleta validada, passo escuro) */
    --s-fixo: #199e70;
    --s-convidado: #d95926;
    --s-goleiro: #3987e5;
    --s-convidado-soft: rgba(217, 89, 38, 0.38);

    --grid: #1b2942;
    --axis: #24344f;
    --dot-off: #26374f;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 14px 34px -20px rgba(0, 0, 0, 0.75);
  }

  [data-theme='light'] {
    color-scheme: light;
    --bg: #eef2f7;
    --surface: #ffffff;
    --surface-2: #eef2f7;
    --border: #e2e8f0;
    --border-soft: #e8edf3;
    --ink: #0f172a;
    --ink-2: #1e293b;
    --ink-muted: #52627a;
    --ink-faint: #6b7c93;
    --accent: #b45309;

    --s-fixo: #1baf7a;
    --s-convidado: #eb6834;
    --s-goleiro: #2a78d6;
    --s-convidado-soft: rgba(235, 104, 52, 0.4);

    --grid: #e6ebf2;
    --axis: #cfd8e3;
    --dot-off: #d3dbe6;

    --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 26px -16px rgba(15, 23, 42, 0.22);
  }

  /* Visitante sem tema carimbado (ex.: primeiro load antes do theme-init) que
     esteja no claro do sistema. O :not() garante que um carimbo explicito
     sempre vence. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']) {
      color-scheme: light;
      --bg: #eef2f7;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --border: #e2e8f0;
      --border-soft: #e8edf3;
      --ink: #0f172a;
      --ink-2: #1e293b;
      --ink-muted: #52627a;
      --ink-faint: #6b7c93;
      --accent: #b45309;

      --s-fixo: #1baf7a;
      --s-convidado: #eb6834;
      --s-goleiro: #2a78d6;
      --s-convidado-soft: rgba(235, 104, 52, 0.4);

      --grid: #e6ebf2;
      --axis: #cfd8e3;
      --dot-off: #d3dbe6;

      --shadow: 0 1px 2px rgba(15, 23, 42, 0.05), 0 10px 26px -16px rgba(15, 23, 42, 0.22);
    }
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink-2);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding-block: 0 64px;
    padding-inline: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  a { color: inherit; }

  /* ---------- header ---------- */
  header { padding: 34px 0 22px; }
  .voltar {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-muted); text-decoration: none; margin-bottom: 16px;
  }
  .voltar:hover { color: var(--ink-2); }
  .voltar:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .eyebrow {
    font-family: "Oswald", -apple-system, sans-serif;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 6px;
  }
  h1 {
    font-family: "Oswald", -apple-system, sans-serif;
    font-weight: 700; color: var(--ink);
    font-size: clamp(32px, 6vw, 46px); letter-spacing: 0.005em;
    text-transform: uppercase; text-wrap: balance;
    margin: 0 0 10px; line-height: 1;
  }
  header p { color: var(--ink-muted); font-size: 14.5px; max-width: 60ch; line-height: 1.55; margin: 0; }

  /* ---------- kpi ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 26px 0 22px;
          background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 16px 18px 18px; }
  .kpi-value { font-size: 30px; font-weight: 650; color: var(--ink); line-height: 1.05; letter-spacing: -0.015em; margin-bottom: 7px; }
  .kpi-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .kpi-note { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; line-height: 1.35; }

  /* ---------- cards ---------- */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; box-shadow: var(--shadow);
  }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .card h2 {
    font-family: "Oswald", -apple-system, sans-serif;
    font-size: 17px; font-weight: 600; letter-spacing: 0.045em; text-transform: uppercase;
    margin: 0; color: var(--ink);
  }
  .card .sub { font-size: 12.5px; color: var(--ink-faint); margin: 5px 0 0; line-height: 1.45; }
  .card-head { margin-bottom: 18px; }

  /* ---------- legenda ---------- */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-muted); margin-bottom: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  /* ---------- composição ---------- */
  .scroll-x { overflow-x: auto; }
  .plot { position: relative; padding-left: 26px; }
  .gridline { position: absolute; left: 26px; right: 0; height: 1px; background: var(--grid); }
  .gridline.base { background: var(--axis); }
  .gridtick { position: absolute; left: 0; width: 22px; text-align: right; font-size: 10.5px;
              color: var(--ink-faint); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
  .comp-chart { position: relative; display: flex; align-items: flex-end; gap: 20px; min-width: min-content; padding: 0 2px; }
  .comp-col { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 62px; flex-shrink: 0; }
  .bar-track { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; width: 22px; }
  .segment { outline: none; cursor: default; }
  .segment:first-child { border-radius: 4px 4px 0 0; }
  .segment:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-muted); }
  .comp-cap { font-size: 12.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; min-height: 15px; }
  .comp-date { font-size: 11.5px; color: var(--ink-muted); }

  /* ---------- avaliação ---------- */
  .linechart { width: 100%; height: auto; display: block; overflow: visible; }
  .dist { display: flex; align-items: flex-end; gap: 10px; margin-top: 6px; }
  .dist-col { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; }
  .dist-cap { font-size: 11.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dist-bar { width: 100%; max-width: 22px; background: var(--s-goleiro); border-radius: 4px 4px 0 0; outline: none; }
  .dist-bar:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-muted); }
  .dist-label { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .bloco-titulo { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 22px 0 2px; }
  .bloco-sub { font-size: 11.5px; color: var(--ink-faint); margin: 0 0 10px; }

  /* ---------- padrinhos (barras horizontais) ---------- */
  .pad-list { display: flex; flex-direction: column; gap: 9px; }
  .pad-row { display: grid; grid-template-columns: minmax(0, 108px) 1fr auto; align-items: center; gap: 10px; }
  .pad-name { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad-lane { display: flex; align-items: center; }
  .pad-bar { height: 10px; background: var(--s-convidado); border-radius: 0 4px 4px 0; min-width: 3px; outline: none; }
  .pad-bar:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-muted); }
  .pad-val { font-size: 12.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 12px; text-align: right; }

  /* ---------- presença (form guide) ---------- */
  .form-cols { columns: 2; column-gap: 32px; }
  .form-row {
    display: flex; align-items: center; gap: 10px; break-inside: avoid;
    padding: 5px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px;
  }
  .form-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .form-dots { display: flex; gap: 3px; flex-shrink: 0; }
  .form-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-off); outline: none; }
  .form-dot.on { background: var(--s-fixo); }
  .form-dot:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-muted); }
  .form-count { font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; width: 30px; text-align: right; }

  /* ---------- tabelas ---------- */
  details { margin-top: 16px; }
  summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸  "; }
  details[open] summary::before { content: "▾  "; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .tbl-wrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  th { color: var(--ink-faint); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chip {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--s-convidado-soft); border-radius: 999px; padding: 1px 8px;
  }
  .td-muted { color: var(--ink-faint); }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; pointer-events: none; background: var(--ink-2); color: var(--bg);
    font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 50; opacity: 0;
    transform: translate(-50%, -100%); transition: opacity 0.1s ease; white-space: nowrap;
  }
  #tip.show { opacity: 1; }
  #tip b { font-variant-numeric: tabular-nums; }

  footer { text-align: center; font-size: 12px; color: var(--ink-faint); margin-top: 30px; line-height: 1.7; }
  footer a { color: var(--ink-muted); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  @media (max-width: 760px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .form-cols { columns: 1; }
    .pad-row { grid-template-columns: minmax(0, 92px) 1fr auto; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="voltar" href="/">← Racha dos Cansados</a>
    <p class="eyebrow">Súmula do racha</p>
    <h1>Estatísticas</h1>
    <p id="subtitulo">Carregando os números direto do banco do bot…</p>
  </header>

  <div id="conteudo" class="stack" hidden></div>
  <div id="carregando" class="card">Carregando…</div>
  <div id="erro" class="card" hidden>Não consegui carregar as estatísticas agora. Tenta recarregar a página em instantes.</div>

  <footer>Gerado a partir do Postgres do bot · <span id="rodape-data"></span><br>
  <a href="/regras/">Regras do racha →</a></footer>
</div>

<div id="tip" role="tooltip"></div>

<script src="/estatistica/estatistica.js"></script>
</body>
</html>
